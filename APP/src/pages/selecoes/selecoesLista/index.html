<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SELEÇÕES</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-zinc-800 flex flex-col justify-center items-center">

    <div class="text-center p-[20px] flex flex-row items-center gap-[10px]">
        <h1 class="font-bold text-[30px] text-white">SELEÇÕES</h1>
        <a 
        class="bg-white p-[3px] rounded-lg shadow-md shadow-lime-600/50 transition-all duration-[.3s] hover:bg-lime-500 hover:text-lime-800 hover:scale-110 active:bg-zinc-700 active:text-zinc-800 active:scale-90 active:shadow-none" 
        href="../selecoesForm/index.html">
            <i class="fa-solid fa-plus text-[16px]"></i>
        </a>
    </div>

    <div class="selecoesContainer m-[20px] flex flex-row justify-center gap-[20px]"></div>

    <div id="modalEdit" class="hidden fixed inset-0 bg-black/50 flex justify-center items-center">
        <div class="bg-white flex flex-row rounded-lg">
            <div class="p-[10px]">
                <div class="w-full flex flex-row justify-evenly items-center">
                    <h1 class="font-bold text-[22px] p-[15px]">EDITAR SELEÇÃO</h1>
                    <i id="closeIcon" class="fa-solid fa-x cursor-pointer hover:text-red-700"></i>
                </div>
                <form id="formPutSelecao" class="flex flex-col gap-[15px] w-[300px] p-[10px] m-[10px]">
                    <div class="flex flex-col">
                        <label class="font-medium" for="">Nome</label>
                        <input class="outline-none border-b-2 transition-all duration-[0.3s] focus:border-sky-600" id="nomeSelecao" type="text" required>
                    </div>
                    
                    <div class="flex flex-col">
                        <label class="font-medium" for="">Técnico</label>
                        <input class="outline-none border-b-2 transition-all duration-[0.3s] focus:border-sky-600" id="tecnicoSelecao" type="text" required>
                    </div>
                    
                    <div class="flex flex-col">
                        <label class="font-medium" for="">Logo (Link/Url)</label>
                        <input class="outline-none border-b-2 transition-all duration-[0.3s] focus:border-sky-600" id="logoSelecao" type="text" required>
                    </div>
                    
                    <div class="flex flex-col">
                        <label class="font-medium" for="">Grupo</label>
                        <select class="block w-full px-3 py-2 bg-white border border-default-medium text-sm rounded-lg shadow-md placeholder:text-body" id="grupoSelect">
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                            <option value="E">E</option>
                            <option value="F">F</option>
                            <option value="G">G</option>
                            <option value="H">H</option>
                            <option value="I">I</option>
                            <option value="J">J</option>
                            <option value="K">K</option>
                            <option value="L">L</option>
                        </select>
                    </div>
                    
                    <div class="w-full">
                        <label class="font-medium">Cores</label>
                        <div class="flex">
                            <input class="w-[40px] h-[40px]" type="color" id="color1" required>
                            <input class="w-[40px] h-[40px]" type="color" id="color2" required>
                        </div>
                    </div>
                    
                    <button class="p-[10px] mt-[10px] font-medium bg-gray-100 rounded-xl cursor-pointer shadow-lg transition-all duration-[0.3s] hover:bg-sky-600 hover:text-white hover:scale-110 active:scale-90 active:shadow-none active:bg-zinc-300" type="submit">Editar</button>
                </form>
            </div>
            <div id="flagPreviewContainer" class="border-3 border-white w-[350px] h-[350px] ml-[20px] object-contain flex items-center justify-center">
                <img class="max-w-[350px] max-h-[300px]" id="flagPreview" src="" alt="">
            </div>
        </div>
    </div>


    <script type="module" src="index.js"></script>
</body>
</html>
