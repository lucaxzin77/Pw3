<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informações Seleção</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="bg-zinc-800 flex flex-col justify-center items-center">

    <div class="fixed w-screen left-5 top-5">
        <button id="btnVoltar" class="cursor-pointer text-white text-[24px] hover:text-zinc-200">
            <a href="../selecoesLista/index.html"><i class="fa-solid fa-arrow-left"></i></a>
        </button>
    </div>

    <div class="w-screen flex flex-row justify-around items-center">
        <div class="flex flex-col items-center gap-[25px] mt-[30px]">
            <img id="logoSel" class="w-[225px]" src="" alt="">
            <div class="text-center">
                <div>
                    <span id="nomeSel" class="text-white font-bold text-[20px]"></span>
                </div>
                <div>
                    <span class="font-bold text-white text-[20px]">Técnico: </span>
                    <span id="tecnicoSel" class="text-white"></span>
                </div>
                <div>
                    <span class="font-bold text-white text-[20px]">Grupo: </span>
                    <span id="grupoSel" class="text-white"></span>
                </div>
            </div>

            <div class="overflow-hidden rounded-xl border border-zinc-200 shadow-sm w-full max-w-md">
                <table class="w-full text-left border-collapse bg-white">
                    <thead>
                        <tr class="bg-zinc-900">
                            <th colspan="2" class="px-4 py-3 text-center text-xs font-bold uppercase tracking-widest text-white">
                                Conquistas
                            </th>
                        </tr>
                        <tr class="bg-zinc-50 border-b border-zinc-200">
                            <th class="px-4 py-2 text-sm font-semibold text-zinc-600">Ano</th>
                            <th class="px-4 py-2 text-sm font-semibold text-zinc-600">País</th>
                        </tr>
                    </thead>
                    <tbody id="bodyConquistas" class="divide-y divide-zinc-100">
                        
                    </tbody>
                </table>
            </div>

        </div>

        <div class="w-[30%]">
            <div class="overflow-hidden rounded-xl border border-zinc-200 shadow-sm w-full max-w-md">
                <table class="w-full text-left border-collapse bg-white">
                    <thead>
                        <tr class="bg-zinc-900">
                            <th colspan="3" class="px-4 py-3 text-center text-xs font-bold uppercase tracking-widest text-white ">
                                Jogadores
                                <button id="addJogadores" class="bg-white rounded-lg p-[5px] text-center transition-all duration-[.3s] hover:bg-lime-400 hover:scale-110 active:bg-lime-900 active:scale-90">
                                    <i class="fa-solid fa-plus text-black text-[14px]"></i>
                                </button> 
                            </th>
                        </tr>
                        <tr class="bg-zinc-50 border-b border-zinc-200">
                            <th class="px-4 py-2 text-sm font-semibold text-zinc-600">Nome</th>
                            <th class="px-4 py-2 text-sm font-semibold text-zinc-600">Posição</th>
                            <th class="px-4 py-2 text-sm font-semibold text-zinc-600">Número</th>
                        </tr>
                    </thead>
                    <tbody id="bodyJogadores" class="divide-y divide-zinc-100">

                    </tbody>
                </table>
            </div>
        </div>

        <div id="modalJogadores" class="hidden fixed inset-0 flex items-center justify-center bg-black/60 z-50">
            <div class="bg-white w-[400px] p-[20px] rounded-lg shadow-lg shadow-indigo-400/50 flex flex-col justify-around items-center">
                <div class="flex flex-row items-center">
                    <h1 class="font-bold text-[22px] p-[15px]">CADASTRAR SELEÇÃO</h1>
                    <i class="fecharModal fa-solid fa-x hover:text-red-700"></i>
                </div>
                <form id="formPostJogadores" class="flex flex-col gap-[15px] w-[85%] p-[10px] m-[10px]">
                    <div class="flex flex-col">
                        <label class="font-medium" for="">Nome</label>
                        <input class="outline-none border-b-2 transition-all duration-[0.3s] focus:border-indigo-600" id="nomeJogador" type="text" required>
                    </div>
                    
                    <div class="flex flex-col">
                        <label class="font-medium" for="">Posição</label>
                        <select class="block w-full px-3 py-2 bg-white border border-default-medium text-sm rounded-lg shadow-md placeholder:text-body" id="posSelect">
                            <option value="Atacante">ATA</option>
                            <option value="Meio-campo">MC</option>
                            <option value="Ponta(Direito)">PD</option>
                            <option value="Ponta(Esquerdo)">PE</option>
                            <option value="Zagueiro">ZAG</option>
                            <option value="Lateral(Direito)">LD</option>
                            <option value="Lateral(Esquerdo)">LE</option>
                            <option value="Goleiro">GOL</option>
                        </select>
                    </div>
                    
                    <div class="flex flex-col">
                        <label class="font-medium" for="">Número</label>
                        <input class="outline-none border-b-2 transition-all duration-[0.3s] focus:border-indigo-600" id="numJogador" type="number" required>
                    </div>
                    
                    <button 
                    class="p-[10px] mt-[10px] font-medium bg-gray-100 rounded-xl cursor-pointer shadow-lg transition-all duration-[0.3s] 
                    hover:bg-indigo-600 hover:text-white hover:scale-110 active:scale-90 active:shadow-none active:bg-zinc-300" type="submit">
                    Cadastrar
                </button>
            </form>
        </div>
    </div>

    </div>


    <script type="module" src="./index.js"></script>
</body>
</html>
