<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CADASTRAR SELEÇÃO</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    
    <div class="bg-zinc-200 w-[350px] h-[290px] flex flex-col justify-around items-center">
        <h1 class="font-bold">CADASTRAR SELEÇÃO</h1>
        <form class="flex flex-col">
            <div class="flex flex-col">
                <label class="" for="">Nome</label>
                <input id="nomeSelecao" type="text" required>
            </div>

            <div class="flex flex-col">
                <label for="">Técnico</label>""""""""
                <input id="tecnicoSelecao" type="text" required>
            </div>

            <div class="flex flex-col">
                <label for="">Logo (Link/Url)</label>
                <input id="logoSelecao" type="text" required>
            </div>

            <div class="flex flex-col">
                <label for="">Grupo</label>
                <select id="grupoSelect">
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                    <option value="E">E</option>
                    <option value="F">F</option>
                    <option value="G">G</option>
                    <option value="H">H</option>
                    <option value="I">I</option>
                    <option value="J">J</option>
                    <option value="K">K</option>
                    <option value="L">L</option>
                </select>
            </div>

            <button class="p-[5px] mt-[10px] bg-white rounded-xl cursor-pointer" type="submit">Cadastrar</button>
        </form>
    </div>

    <div>

    </div>

    <script type="module" src="index.js"></script>
</body>
</html>
